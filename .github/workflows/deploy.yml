name: Deploy Website to GoDaddy
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name: 🎉 Deploy to GoDaddy cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: 92.205.100.186
          port: 22
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './'
          remote_path: /home/wkeknrf3y94o/public_html
          sftp_only: true
          rsyncArgs: '--exclude=.git --exclude=.github --exclude=.idea --exclude=README.md'
          sftpArgs: '-o ConnectTimeout=15'
